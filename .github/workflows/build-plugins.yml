name: Build VST3 & AU Plugins (Eversynth Hybrid Architecture)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web-ui:
    name: Build 1:1 Web UI Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        run: |
          npm install
          npm run build

      - name: Upload Web UI Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-dist
          path: dist
          retention-days: 1

  build:
    name: Build on ${{ matrix.name }}
    needs: build-web-ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal VST3 & AU Hybrid)
            os: macos-14
            artifact_name: PhotoSynth-macOS-Universal
            build_type: Release
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"

          - name: Windows (64-bit VST3 & Standalone Hybrid)
            os: windows-latest
            artifact_name: PhotoSynth-Windows-x64
            build_type: Release
            cmake_args: "-A x64"

          - name: Linux (Ubuntu VST3 & Standalone Hybrid)
            os: ubuntu-22.04
            artifact_name: PhotoSynth-Linux-x64
            build_type: Release
            cmake_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Web UI Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-ui-dist
          path: dist

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libcurl4-openssl-dev \
            ninja-build
          sudo apt-get install -y libwebkit2gtk-4.0-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev || true

      - name: Install macOS Tools
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true

      - name: Install Windows WebView2 Package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p packages
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages
          echo "JUCE_WEBVIEW2_PACKAGE_LOCATION=$GITHUB_WORKSPACE/packages" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/packages/Microsoft.Web.WebView2.1.0.2903.40/build/native;$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_args }}

      - name: Build Hybrid Plugins
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Prepare macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/VST3 artifacts/AU artifacts/Standalone
          find build -name "*.vst3" -maxdepth 5 -exec cp -R {} artifacts/VST3/ \;
          find build -name "*.component" -maxdepth 5 -exec cp -R {} artifacts/AU/ \;
          find build -name "*.app" -maxdepth 5 -exec cp -R {} artifacts/Standalone/ \; || true
          
          # Ensure offline Web UI bundle is present in bundle resources
          for p in artifacts/VST3/*.vst3 artifacts/AU/*.component artifacts/Standalone/*.app; do
            if [ -d "$p" ]; then
              mkdir -p "$p/Contents/Resources/ui"
              cp -R dist/* "$p/Contents/Resources/ui/"
            fi
          done
          cd artifacts && zip -r ../${{ matrix.artifact_name }}.zip .

      - name: Prepare Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts/VST3 artifacts/Standalone
          find build -name "*.vst3" -maxdepth 5 -exec cp -R {} artifacts/VST3/ \;
          find build -name "*.exe" -not -path "*/CMakeFiles/*" -exec cp -R {} artifacts/Standalone/ \; || true
          
          # Bundle offline web assets alongside the binaries
          mkdir -p artifacts/VST3/ui artifacts/Standalone/ui
          cp -R dist/* artifacts/VST3/ui/ || true
          cp -R dist/* artifacts/Standalone/ui/ || true
          cd artifacts && 7z a -tzip ../${{ matrix.artifact_name }}.zip .

      - name: Prepare Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/VST3 artifacts/Standalone
          find build -name "*.vst3" -maxdepth 5 -exec cp -R {} artifacts/VST3/ \;
          find build -maxdepth 5 -type f -executable -not -path "*/CMakeFiles/*" -name "*Photo*Synth*" -exec cp {} artifacts/Standalone/ \; || true
          
          mkdir -p artifacts/VST3/ui artifacts/Standalone/ui
          cp -R dist/* artifacts/VST3/ui/ || true
          cp -R dist/* artifacts/Standalone/ui/ || true
          cd artifacts && zip -r ../${{ matrix.artifact_name }}.zip .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/**/*.zip
          name: Photo Synth Hybrid ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
